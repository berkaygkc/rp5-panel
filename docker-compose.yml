# Çekirdeği kaldırmak için:
#   docker compose up -d --build
#
# Şema ve varsayılanlar açılışta kendiliğinden kurulur (docker/entrypoint.sh).
# Veritabanı ./.data içinde, konteynerin dışında durur — imajı silmek veriyi silmez.
#
# Ters vekil (nginx, Caddy, Cloudflare) arkasına koyarken WebSocket yükseltmesine
# izin verin: /ws yolu Upgrade ve Connection başlıklarını iletmelidir.
services:
  core:
    build: .
    image: rp5-core
    container_name: rp5-core
    restart: unless-stopped
    # Dışarıdaki port PORT ile değiştirilebilir: PORT=3013 docker compose up -d
    ports:
      - "${PORT:-3012}:3012"
    volumes:
      # Panelin gerçek veritabanı ve bildirimleri
      - ./.data:/data
    # Konteynerden Mac'teki servislere (Beszel gibi) ulaşmak için
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      # NOTICE_TOKEN, ADMIN_SESSION_SECRET, BESZEL_* buradan gelir
      - .env.local
    environment:
      PANEL_DATA_DIR: /data
      # Pi ve telefon LAN'dan bağlanır; alt ağ farklıysa burayı değiştirin
      PANEL_LAN_SUBNET: ${PANEL_LAN_SUBNET:-192.168.1}
